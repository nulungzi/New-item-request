<!doctype html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--card:#fff;--line:#e2e5ea;--accent:#2f6fec;--muted:#6b7280;--ok:#1f8a4c;--spot:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e8eaee;--card:#1d2128;--line:#2d333c;--accent:#6a9bff;--muted:#9aa3af;--ok:#4ade80;--spot:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:15px}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px}h2{font-size:1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
textarea,input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{width:100%;min-height:140px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
button{font:inherit;border:0;border-radius:8px;padding:10px 16px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted);font-size:.85rem}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n{text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap}
.b-ok{color:var(--ok);border:1px solid var(--ok)}.b-spot{color:var(--spot);border:1px solid var(--spot)}
.rates label,.remarks label{display:block;margin-bottom:8px}
.remarks textarea{min-height:48px;font-family:inherit}
.err{color:#dc2626;white-space:pre-wrap}
a{color:var(--accent)}
/* 입력 표 */
.req-head,.req-row{display:grid;grid-template-columns:28px minmax(0,1fr) 90px 150px 36px;gap:6px;align-items:start}
.req-head{font-size:.8rem;color:var(--muted);padding:0 0 4px}
.req-row{margin-bottom:6px}
.req-row input{width:100%;min-width:0}
.req-no{padding-top:10px;text-align:right;color:var(--muted);font-size:.8rem}
.req-desc{grid-column:2/-1;font-size:.75rem;color:var(--muted);margin-top:-2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req-desc.bad{color:var(--spot)}
.btn-x{background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 0}
.btn-sub{background:transparent;color:var(--accent);border:1px solid var(--accent)}
@media (max-width:560px){
  .req-head{display:none}
  .req-row{grid-template-columns:24px 1fr 1fr 36px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .req-row .req-no{grid-row:1;grid-column:1}
  .req-row .f-item{grid-row:1;grid-column:2/-1}
  .req-row .f-qty{grid-row:2;grid-column:2}
  .req-row .f-need{grid-row:2;grid-column:3}
  .req-row .btn-x{grid-row:2;grid-column:4}
  .req-row .req-desc{grid-row:3}
  .req-desc{grid-column:2/-1}
}
/* 미리보기 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{background:transparent;color:var(--fg);border:1px solid var(--line);padding:6px 12px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pv{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
</style>
</head>
<body><main>
<h1>소요제기 판정 · 구매내역서</h1>

<div class="card">
  <h2>1. 소요제기 입력</h2>
  <p class="muted">품목마다 <b>Item · 수량 · Need-by</b>를 입력하세요. 엑셀에서 여러 줄을 복사해 아무 칸에나 붙여넣으면 표가 자동으로 채워집니다.
    계약 여부는 <b>Need-by(출고일)</b> 기준으로 판정합니다.</p>
  <div class="req-head"><span></span><span>Item</span><span>수량</span><span>Need-by</span><span></span></div>
  <div id="reqRows"></div>
  <datalist id="itemList"></datalist>
  <div class="row" style="margin-top:6px">
    <button class="btn-sub" id="btnAdd" type="button">+ 행 추가</button>
    <button class="btn-sub" id="btnClear" type="button">모두 지우기</button>
  </div>
  <div class="row" style="margin-top:14px">
    <label>작성일 <input type="date" id="base"></label>
    <button id="btnClassify">판정하기</button>
  </div>
  <div id="msg1" class="err"></div>
</div>

<div id="result" hidden>
  <div class="card">
    <h2>2. 판정 결과</h2>
    <div id="counts" class="muted"></div>
    <div class="scroll"><table id="tbl"></table></div>
  </div>

  <div class="card" id="purchaseCard" hidden>
    <h2>3. 계약 품목 → 구매내역서</h2>
    <div class="rates" id="rates"></div>
    <div class="remarks" id="remarks"></div>
    <button id="btnCreate">구매내역서 만들기</button>
    <div id="msg2" style="margin-top:10px"></div>
  </div>

  <div class="card" id="spotCard" hidden>
    <h2>4. Spot 품목 (계약 없음 · 견적 필요)</h2>
    <p class="muted">구매내역서에는 들어가지 않습니다.</p>
    <div class="scroll"><table id="spotTbl"></table></div>
  </div>

  <div class="card" id="previewCard" hidden>
    <h2>5. 구매내역서 미리보기</h2>
    <div class="tabs" id="pvTabs"></div>
    <iframe class="pv" id="pvFrame" sandbox="allow-same-origin" title="구매내역서 미리보기"></iframe>
    <p class="muted" id="pvNote"></p>
  </div>
</div>

<script>
var state = { results: [], rates: {} };
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fmt(n) { return n == null ? '' : Number(n).toLocaleString('ko-KR', { maximumFractionDigits: 4 }); }
function call(fn) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (ok, fail) { google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn].apply(null, args); });
}

/* ---------- 소요제기 입력 표 ---------- */
var itemDesc = {};
function normDate(t) {
  t = String(t || '').trim();
  var m = t.match(/^(\d{4})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})/) ;
  if (m) return m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2);
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return m[3] + '-' + ('0' + m[1]).slice(-2) + '-' + ('0' + m[2]).slice(-2);
  return '';
}
function addRow(v) {
  v = v || {};
  var row = document.createElement('div');
  row.className = 'req-row';
  row.innerHTML = '<span class="req-no"></span>' +
    '<input class="f-item" list="itemList" placeholder="Item (예: KERC00053)" autocomplete="off" autocapitalize="characters">' +
    '<input class="f-qty" type="number" min="0" step="any" inputmode="decimal" placeholder="수량">' +
    '<input class="f-need" type="date">' +
    '<button class="btn-x" type="button" title="행 삭제">✕</button>' +
    '<div class="req-desc"></div>';
  $('reqRows').appendChild(row);
  row.querySelector('.f-item').value = v.item || '';
  row.querySelector('.f-qty').value = v.qty || '';
  row.querySelector('.f-need').value = v.need || '';
  row.querySelector('.btn-x').onclick = function () { row.remove(); if (!rows().length) addRow(); renumber(); };
  row.querySelector('.f-item').oninput = function () { showDesc(row); };
  row.querySelectorAll('input').forEach(function (inp) { inp.addEventListener('paste', onPaste); });
  showDesc(row); renumber();
  return row;
}
function rows() { return [].slice.call(document.querySelectorAll('.req-row')); }
function renumber() { rows().forEach(function (r, i) { r.querySelector('.req-no').textContent = i + 1; }); }
function showDesc(row) {
  var k = row.querySelector('.f-item').value.trim().replace(/\s+/g, ' ').toUpperCase(), el = row.querySelector('.req-desc');
  if (!k) { el.textContent = ''; return; }
  var d = itemDesc[k];
  el.textContent = d != null ? d : '자재정보에 없는 Item → Spot';
  el.className = 'req-desc' + (d != null ? '' : ' bad');
}
// 엑셀에서 여러 칸/줄 붙여넣기 → 현재 칸부터 채움
function onPaste(e) {
  var t = (e.clipboardData || window.clipboardData).getData('text');
  if (!/[\t\n]/.test(t.replace(/\n$/, ''))) {
    if (e.target.classList.contains('f-need')) { var d = normDate(t); if (d) { e.preventDefault(); e.target.value = d; } }
    return;
  }
  e.preventDefault();
  var lines = t.replace(/\r/g, '').replace(/\n+$/, '').split('\n');
  var all = rows(), start = all.indexOf(e.target.closest('.req-row'));
  var fields = ['f-item', 'f-qty', 'f-need'], col = fields.findIndex(function (f) { return e.target.classList.contains(f); });
  lines.forEach(function (line, i) {
    var row = all[start + i] || addRow();
    all = rows();
    line.split('\t').forEach(function (cell, j) {
      var f = fields[col + j];
      if (!f) return;
      cell = cell.trim();
      if (f === 'f-qty') cell = cell.replace(/,/g, '');
      if (f === 'f-need') cell = normDate(cell);
      row.querySelector('.' + f).value = cell;
    });
    showDesc(row);
  });
}
function requestText() {
  return rows().map(function (r) {
    return [r.querySelector('.f-item').value.trim(), r.querySelector('.f-qty').value.trim(), r.querySelector('.f-need').value].join('\t');
  }).filter(function (l) { return l.replace(/\t/g, '').trim(); }).join('\n');
}
$('btnAdd').onclick = function () { addRow().querySelector('.f-item').focus(); };
$('btnClear').onclick = function () { $('reqRows').innerHTML = ''; for (var i = 0; i < 3; i++) addRow(); };
for (var i = 0; i < 3; i++) addRow();

call('apiInit').then(function (d) {
  $('base').value = d.today; state.rates = d.rates || {};
  (d.items || []).forEach(function (x) { itemDesc[x[0]] = x[1]; });
  $('itemList').innerHTML = (d.items || []).map(function (x) {
    return '<option value="' + esc(x[0]) + '">' + esc(String(x[1]).slice(0, 60)) + '</option>';
  }).join('');
  rows().forEach(showDesc);
});

$('btnClassify').onclick = function () {
  var b = this; $('msg1').textContent = '';
  var text = requestText();
  var bad = rows().filter(function (r) {
    var it = r.querySelector('.f-item').value.trim(), q = r.querySelector('.f-qty').value.trim();
    return (it || q) && !(it && Number(q) > 0);
  });
  if (bad.length) { $('msg1').textContent = 'Item과 수량을 확인해 주세요: ' + bad.map(function (r) { return r.querySelector('.req-no').textContent; }).join(', ') + '행'; return; }
  if (!text) { $('msg1').textContent = 'Item을 입력해 주세요.'; return; }
  b.disabled = true;
  call('apiClassify', text, $('base').value).then(function (d) {
    state.results = d.results; state.rates = d.rates || state.rates;
    $('previewCard').hidden = true;
    render();
    $('result').scrollIntoView({ behavior: 'smooth' });
  }).catch(function (e) { $('msg1').textContent = e.message || e; }).finally(function () { b.disabled = false; });
};

function chosen(r) { var s = $('pick-' + r.line); return r.candidates[s ? +s.value : 0]; }

function render() {
  var rs = state.results;
  $('result').hidden = !rs.length;
  var ok = rs.filter(function (r) { return r.status === '계약'; }), spot = rs.filter(function (r) { return r.status === 'Spot'; });
  $('counts').textContent = '전체 ' + rs.length + '건 · 계약 ' + ok.length + '건 · Spot ' + spot.length + '건';

  $('tbl').innerHTML = '<tr><th>판정</th><th>Item</th><th>수량</th><th>Need-by</th><th>업체 / 단가</th><th>계약기간</th><th>Description</th><th>비고</th></tr>' +
    rs.map(function (r) {
      var c = r.candidates;
      var sup = !c.length ? '' : c.length === 1 ? esc(c[0].supplier) + ' · ' + fmt(c[0].price) + ' ' + esc(c[0].cur) + ' / ' + esc(c[0].uom)
        : '<select id="pick-' + r.line + '">' + c.map(function (x, i) {
            return '<option value="' + i + '">' + esc(x.supplier) + ' · ' + fmt(x.price) + ' ' + esc(x.cur) + ' (' + esc(x.priceMode) + ')</option>';
          }).join('') + '</select>';
      var c0 = c[0] || {};
      return '<tr><td><span class="badge ' + (r.status === '계약' ? 'b-ok' : 'b-spot') + '">' + (r.status === '계약' ? esc(c0.priceMode || '계약') : 'Spot') + '</span></td>' +
        '<td>' + esc(r.item) + '</td><td class="n">' + fmt(r.qty) + '</td><td>' + esc(r.needBy) + '</td><td>' + sup + '</td>' +
        '<td>' + (c0.start ? esc(c0.start) + ' ~ ' + esc(c0.end) : '') + '</td><td>' + esc(c0.desc || r.desc || '') + '</td><td class="muted">' + esc(r.reason) + (r.warnings && r.warnings.length ? '<div class="err">⚠ ' + esc(r.warnings.join(' · ')) + '</div>' : '') + '</td></tr>';
    }).join('');
  rs.forEach(function (r) { var s = $('pick-' + r.line); if (s) s.onchange = renderPurchase; });

  $('spotCard').hidden = !spot.length;
  $('spotTbl').innerHTML = '<tr><th>Item</th><th>수량</th><th>Need-by</th><th>사유</th></tr>' + spot.map(function (r) {
    return '<tr><td>' + esc(r.item) + '</td><td class="n">' + fmt(r.qty) + '</td><td>' + esc(r.needBy) + '</td><td class="muted">' + esc(r.reason) + '</td></tr>';
  }).join('');
  renderPurchase();
}

function renderPurchase() {
  var ok = state.results.filter(function (r) { return r.status === '계약'; });
  $('purchaseCard').hidden = !ok.length;
  if (!ok.length) return;
  var keep = {}; // 입력 중인 값 유지
  document.querySelectorAll('[data-rate],[data-remark]').forEach(function (el) { keep[el.id] = el.value; });

  var curs = [], sups = [];
  ok.forEach(function (r) {
    var c = chosen(r);
    if (c.cur !== 'KRW' && curs.indexOf(c.cur) < 0) curs.push(c.cur);
    if (sups.indexOf(c.supplier) < 0) sups.push(c.supplier);
  });
  $('rates').innerHTML = '<p class="muted">통화별 환율 (1 단위당 KRW)</p>' + curs.map(function (c) {
    var id = 'rate-' + c;
    var v = keep[id] != null ? keep[id] : (state.rates[c] || '');
    return '<label>' + esc(c) + ' <input type="number" step="0.01" inputmode="decimal" data-rate="' + esc(c) + '" id="' + id + '" value="' + esc(v) + '"></label>';
  }).join('');
  $('remarks').innerHTML = '<p class="muted">업체별 비고 (구매세부내역 비고 열에 들어갑니다)</p>' + sups.map(function (s, i) {
    var id = 'remark-' + i;
    return '<label>' + esc(s) + '<textarea data-remark="' + esc(s) + '" id="' + id + '">' + esc(keep[id] || '') + '</textarea></label>';
  }).join('');
}

$('btnCreate').onclick = function () {
  var b = this; b.disabled = true; $('msg2').innerHTML = '만드는 중…';
  var rates = {}, remarks = {};
  document.querySelectorAll('[data-rate]').forEach(function (el) { rates[el.dataset.rate] = el.value; });
  document.querySelectorAll('[data-remark]').forEach(function (el) { remarks[el.dataset.remark] = el.value; });
  var lines = state.results.filter(function (r) { return r.status === '계약'; }).map(function (r) {
    return { item: r.item, qty: r.qty, needBy: r.needBy, program: r.program, contractRow: chosen(r).row };
  });
  call('apiCreatePurchase', { baseDate: $('base').value, rates: rates, remarks: remarks, lines: lines }).then(function (d) {
    state.rates = Object.assign(state.rates, rates);
    $('msg2').innerHTML = '✅ 만들었습니다: <a href="' + esc(d.url) + '" target="_blank">' + esc(d.name) + '</a>';
    loadPreview(d);
  }).catch(function (e) { $('msg2').innerHTML = '<span class="err">' + esc(e.message || e) + '</span>'; })
    .finally(function () { b.disabled = false; });
};

/* ---------- 미리보기 ---------- */
function loadPreview(d) {
  $('previewCard').hidden = false;
  $('pvTabs').innerHTML = '';
  $('pvNote').textContent = '미리보기 불러오는 중…';
  $('pvFrame').srcdoc = '';
  call('apiPreview', d.id).then(function (tabs) {
    $('pvTabs').innerHTML = tabs.map(function (t, i) { return '<button type="button" data-i="' + i + '">' + esc(t.name) + '</button>'; }).join('');
    var show = function (i) {
      var t = tabs[i];
      document.querySelectorAll('#pvTabs button').forEach(function (b) { b.classList.toggle('on', +b.dataset.i === i); });
      $('pvFrame').srcdoc = /<html/i.test(t.html) ? t.html
        : '<!doctype html><html><head><meta charset="utf-8"><style>body{margin:8px;background:#fff;color:#000}</style></head><body>' + t.html + '</body></html>';
      $('pvNote').textContent = (t.mode === 'simple' ? '간단 보기(테두리는 실제와 다를 수 있음). ' : '') + '수정은 위 링크에서 구글 시트로 여세요.';
    };
    document.querySelectorAll('#pvTabs button').forEach(function (b) { b.onclick = function () { show(+b.dataset.i); }; });
    show(0);
    $('previewCard').scrollIntoView({ behavior: 'smooth' });
  }).catch(function (e) { $('pvNote').textContent = '미리보기를 불러오지 못했습니다: ' + (e.message || e); });
}
</script>
</main></body></html>
